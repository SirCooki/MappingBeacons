[config]
schemaVersion = "0.0.1"

[package]
namespace = "SirCookieAndTheThralls" # team that owns the upload tokens (token name: QantateTOP)
name = "MappingBeacons"
versionNumber = "0.0.0" # set by publish.ps1 from Plugin.cs (DLL and package versions are always equal)
description = "Build a beacon, fuel it and scout out the environment. Higher beacon tears will reveal more information."
websiteUrl = "https://github.com/SirCooki/MappingBeacons"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2360"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "../README.md"
outdir = "./build"

[[build.copy]]
source = "../bin/Release/net462/ScoutingBeacons.dll"
target = "plugins/ScoutingBeacons/ScoutingBeacons.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "building", "utility", "deep-north-update"]
